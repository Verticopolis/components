name: 🐛 Bug report
description: A sprite, window, menu, sound or the engine binding in @verticopolis/components behaves incorrectly or crashes.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! This repository holds what a frontend builds on: the renderer and Excalibur scene, the Windows 95 windows and menus, the procedural sprites and audio, and the engine binding and host loader. A rule of the simulation belongs on [Verticopolis/engine](https://github.com/Verticopolis/engine/issues/new/choose); if you're not sure, use [Verticopolis/web](https://github.com/Verticopolis/web/issues/new/choose).
  - type: input
    id: version
    attributes:
      label: Version
      description: The package version or commit, or the whole version line from the game's title screen.
      placeholder: "0.1.0, or v4.14.2 · Rust engine 1.57.1 (1a2b3c4d5e6f)"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rendering, sprites or the scene
        - Windows, menus or dialogs
        - Audio
        - Engine binding or host loader
        - Styles
        - Other (note in description)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead. A screenshot helps for anything you can see.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The code or the game steps that show it. Write menu commands as a path from the menu bar, like Tower > Statistics….
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - Not in a browser (Node or tests)
        - Other (note in description)
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Paste any errors from the browser dev-tools console or the test output. This is automatically formatted as code.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
