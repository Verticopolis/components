name: ✨ Feature request
description: Suggest a component, a window, a sprite, a sound or an export the package does not have yet.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        New gameplay (rooms, rules, modes) belongs on [Verticopolis/engine](https://github.com/Verticopolis/engine/issues/new/choose) or, for ideas about the game as a whole, [Verticopolis/web](https://github.com/Verticopolis/web/issues/new/choose). This form is for what a frontend builds with.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to build or do, and what's missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? For an export, the import path and what it takes and gives.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why this one is better.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
