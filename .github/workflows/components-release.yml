name: Release components

# Releases @verticopolis/components when a push to main raises the version in
# package.json (README, "Releasing"). A release PR raises it; this workflow
# then packs that commit (scripts/pack-components.sh), tags v<version> on it,
# publishes the GitHub release with the version's CHANGELOG.md section, the
# tarball and its checksum, and then publishes that same tarball to npm and
# bakes the sprite atlas onto the release (sprite-atlas.yml). A maintainer
# can also run it from the Actions tab on main to finish a run that failed;
# it releases the version package.json names on main.
#
# The check job reads package.json and the existing tags and releases, with
# no credential and no approval, so a push that leaves the version alone ends
# there. The release job tags and publishes the GitHub release without an
# approval, as the engine's Release tags workflow does: the version raise
# already came through a reviewed release PR. Only the npm job waits on the
# `registry` environment, which only the owner can approve, so a release
# takes one approval and no npm version appears without it. The `registry`
# environment must exist on this repository with that rule: GitHub creates a
# missing one with no protection. The npm job installs nothing and runs no
# code from the repository, so the OIDC token it may request never reaches a
# dependency's install script. npm
# publishes through trusted publishing: npm trusts this repository, this
# workflow file and that environment, and exchanges GitHub's OIDC token for a
# short-lived publish token, so no npm token is stored anywhere, and npm
# records a provenance statement.
#
# Versions up to 0.2.1 were tagged components-v<version>; the check treats
# either tag as released, so those versions are never released twice. A tag,
# release or npm version that already exists is left alone, so a re-run
# finishes what a failed run started.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions: {}

# One release run at a time. A run waiting for approval holds the group; a
# later push queues behind it, and each run releases whatever package.json
# names when it starts, so a replaced queued run only skips an intermediate
# version.
concurrency:
  group: components-release
  cancel-in-progress: false

jobs:
  check:
    name: Find the version to release
    # A release is cut from main, never from a branch's unmerged code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Read the version and look for its release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::package.json names $version, which is not a version (x.y.z or x.y.z-pre)."
            exit 1
          fi
          for tag in "v$version" "components-v$version"; do
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null || true)" = false ]; then
              if [ "$(npm view "@verticopolis/components@$version" version 2> /dev/null || true)" = "$version" ]; then
                echo "$version is already released ($tag) and on npm; nothing to do."
                exit 0
              fi
              if [ "$tag" != "v$version" ]; then
                echo "::error::$version was released as $tag but is not on npm. Publish it by hand; this workflow only publishes v<version> releases."
                exit 1
              fi
            fi
          done
          echo "Releasing $version (v$version)."
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    name: Pack, tag and release
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The version's CHANGELOG.md section, heading excluded, is the
      # release's notes; checked before anything is tagged.
      - name: Read the changelog section
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '/^## / { if (on) exit; if ($2 == v) { on = 1; next } } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "::error::CHANGELOG.md has no $VERSION section. Rename its Unreleased heading in a release PR."; exit 1; fi
          printf '\nThe tarball and its SHA-256 checksum are attached. On npm as [`@verticopolis/components@%s`](https://www.npmjs.com/package/@verticopolis/components/v/%s) once the owner approves the publish.\n' "$VERSION" "$VERSION" >> notes.md

      - name: Pack
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: sh scripts/pack-components.sh "$VERSION" dist

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --json isDraft --jq .isDraft > draft.txt 2> /dev/null; then
            if [ "$(cat draft.txt)" != "true" ]; then
              # A published release is never edited. The npm job publishes
              # its attached tarball, so a re-run can still finish npm.
              echo "$tag already has a release; leaving it."
              exit 0
            fi
            gh release delete "$tag" --yes
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
            # The tarball in dist/ is packed from this run's commit, so a tag
            # on any other commit would get bytes it never held. Peel an
            # annotated tag to its commit before comparing.
            target="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha)"
            if [ "$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.type)" = "tag" ]; then
              target="$(gh api "repos/$GH_REPO/git/tags/$target" --jq .object.sha)"
            fi
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::$tag is on $target, not on this run's commit $GITHUB_SHA. A release packs main, so release a new version, or delete the tag if it is wrong."
              exit 1
            fi
            echo "$tag exists on this commit; releasing it."
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
            target="$GITHUB_SHA"
            echo "Tagged $tag at $GITHUB_SHA."
          fi
          # A release becomes Latest; a prerelease never does.
          kind="--latest"
          case "$VERSION" in *-*) kind="--prerelease --latest=false" ;; esac
          # Attach while a draft, then publish, so a published release is never edited.
          # shellcheck disable=SC2086 # $kind holds one or two flags
          gh release create "$tag" --target "$target" --title "$tag" $kind --draft \
            --notes-file notes.md
          gh release upload "$tag" dist/*
          # shellcheck disable=SC2086
          gh release edit "$tag" --draft=false $kind
          echo "Published $tag with $(ls dist | tr '\n' ' ')"

  # Bakes the sprite atlas for the release and attaches it (docs/atlas.md).
  # It runs beside the npm job and nothing waits on it, so a slow or failed
  # bake never holds the release or the npm publish back; run Sprite atlas by
  # hand from the tag to retry it.
  atlas:
    name: Sprite atlas
    needs: [check, release]
    permissions:
      contents: write
    uses: ./.github/workflows/sprite-atlas.yml
    with:
      tag: v${{ needs.check.outputs.version }}

  npm:
    name: Publish to npm
    needs: [check, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: registry
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Publish the release's tarball
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' 11.5.1 "$have" | sort -V | head -n 1)" != 11.5.1 ]; then echo "::error::npm $have is older than 11.5.1, which trusted publishing needs."; exit 1; fi
          if [ "$(npm view "@verticopolis/components@$VERSION" version 2> /dev/null || true)" = "$VERSION" ]; then
            echo "@verticopolis/components@$VERSION is already on npm; leaving it."
            exit 0
          fi
          tgz="verticopolis-components-$VERSION.tgz"
          gh release download "v$VERSION" --pattern "$tgz" --pattern "$tgz.sha256" --dir release
          (cd release && sha256sum -c "$tgz.sha256")
          named="$(tar -xOzf "release/$tgz" package/package.json | jq -r '.name + "@" + .version')"
          if [ "$named" != "@verticopolis/components@$VERSION" ]; then echo "::error::$tgz holds $named, not @verticopolis/components@$VERSION."; exit 1; fi
          # A prerelease goes up under its own dist-tag, so `latest` stays a release.
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          # The ./ keeps npm from reading release/<file> as a GitHub owner/repo.
          npm publish "./release/$tgz" --access public --provenance --tag "$tag"
          echo "Published @verticopolis/components@$VERSION ($tag)."
