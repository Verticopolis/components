name: Screenshots

# Compares the component gallery with the committed screenshots in
# e2e/__screenshots__ (playwright.config.ts, e2e/gallery.spec.ts): every piece
# the package draws, in each color scheme, on a desktop and a phone screen. It
# runs inside the pinned Playwright image, the one the baselines are minted
# in, because glyph and canvas rasterization differ across Chromium builds.
# To refresh the baselines, push a commit whose message contains
# [update-screenshots] (Update screenshots workflow).

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "gallery/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "scripts/build-lib.sh"
      - "vite.lib.config.ts"
      - "tsconfig*.json"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/screenshots.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  # The image tag follows the locked Playwright version, so the browser the
  # comparison runs in can never drift from the one the baselines came from.
  # (container.image is fixed before a job's steps run, so the tag comes from
  # this prior job's output.)
  resolve-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image: ${{ steps.pin.outputs.image }}
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Every pull request reports this check, so the branch rules can
      # require it. When the PR touches none of the paths the push trigger
      # lists (or .nvmrc), the compare job is skipped.
      - name: Decide whether this change needs the screenshot comparison
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Collect the list first, so a failing git diff fails the step
          # instead of skipping the work.
          changed="$(git diff --name-only --no-renames "$BASE...$HEAD")"
          if printf '%s\n' "$changed" | grep -qE '^(src/|gallery/|e2e/|playwright\.config\.ts$|scripts/build-lib\.sh$|vite\.lib\.config\.ts$|tsconfig[^/]*\.json$|package(-lock)?\.json$|\.github/workflows/screenshots\.yml$|\.nvmrc$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No file the screenshot comparison reads changed; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - id: pin
        run: |
          ver=$(node -e "process.stdout.write(require('./package-lock.json').packages['node_modules/playwright'].version)")
          echo "image=mcr.microsoft.com/playwright:v${ver}-jammy" >> "$GITHUB_OUTPUT"

  compare:
    name: Compare the gallery screenshots
    needs: resolve-image
    # Skipped (which a required check counts as passing) when the pull
    # request touches nothing the comparison reads, so the image is not
    # pulled. If resolve-image failed, this job still starts and fails (it
    # has no image), so the required check never passes on a failed scope.
    if: ${{ !cancelled() && (needs.resolve-image.result != 'success' || needs.resolve-image.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: ${{ needs.resolve-image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - name: Typecheck the specs
        run: npx tsc -p e2e/tsconfig.json --noEmit

      # The web server in playwright.config.ts builds the package and the
      # gallery before it serves the page.
      - name: Compare the screenshots
        run: npx playwright test

      - name: Upload the diffs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: |
            playwright-report/
            test-results/
          retention-days: 7
