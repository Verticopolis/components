name: Gallery

# The component gallery (gallery/): every reusable piece of the package in
# each color scheme, built from lib/ the way a consumer would. A pull request
# builds it and keeps the Pages artifact, so a broken gallery fails before
# merge; a push to main also publishes it to GitHub Pages. No pull request
# gets a preview deployment.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "gallery/**"
      - "scripts/build-lib.sh"
      - "vite.lib.config.ts"
      - "tsconfig*.json"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/gallery.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build the gallery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Every pull request reports this check, so the branch rules can
      # require it. When the PR touches none of the paths the push trigger
      # lists (or .nvmrc), the steps below are skipped.
      - name: Decide whether this change needs the gallery build
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Collect the list first, so a failing git diff fails the step
          # instead of skipping the work.
          changed="$(git diff --name-only --no-renames "$BASE...$HEAD")"
          if printf '%s\n' "$changed" | grep -qE '^(src/|gallery/|scripts/build-lib\.sh$|vite\.lib\.config\.ts$|tsconfig[^/]*\.json$|package(-lock)?\.json$|\.github/workflows/gallery\.yml$|\.nvmrc$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No file the gallery build reads changed; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.scope.outputs.run == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: ${{ steps.scope.outputs.run == 'true' }}
      - name: Build the package into lib/
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: npm run build
      - name: Typecheck the gallery against lib/
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: npx tsc -p gallery/tsconfig.json --noEmit
      - name: Build the gallery
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: npm run gallery:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ steps.scope.outputs.run == 'true' }}
        with:
          path: dist-gallery

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gallery-pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
