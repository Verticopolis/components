name: Gallery

# The component gallery (gallery/): every reusable piece of the package in
# each color scheme, built from lib/ the way a consumer would. A pull request
# builds it and keeps the Pages artifact, so a broken gallery fails before
# merge; a push to main also publishes it to GitHub Pages. No pull request
# gets a preview deployment.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "gallery/**"
      - "scripts/build-lib.sh"
      - "vite.lib.config.ts"
      - "tsconfig*.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gallery.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "gallery/**"
      - "scripts/build-lib.sh"
      - "vite.lib.config.ts"
      - "tsconfig*.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gallery.yml"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build the gallery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the package into lib/
        run: npm run build
      - name: Typecheck the gallery against lib/
        run: npx tsc -p gallery/tsconfig.json --noEmit
      - name: Build the gallery
        run: npm run gallery:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-gallery

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gallery-pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
