name: Gallery

# The component gallery: an Astro and Starlight site (site/) whose pages
# mount the demos in gallery/, every reusable piece of the package built from
# lib/ the way a consumer would. A pull request
# builds it and keeps the page as the gallery-site artifact, so a broken
# gallery fails before merge, and Gallery preview (gallery-preview.yml)
# publishes that page as the pull request's preview. A push to main stores the
# live gallery and publishes the site to GitHub Pages
# (gallery-pages-publish.yml).

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "gallery/**"
      - "site/**"
      - "ARCHITECTURE.md"
      - "docs/**"
      - "scripts/build-lib.sh"
      - "vite.lib.config.ts"
      - "tsconfig*.json"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/gallery.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build the gallery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Every pull request reports this check, so the branch rules can
      # require it. When the PR touches none of the paths the push trigger
      # lists (or .nvmrc), the steps below are skipped.
      - name: Decide whether this change needs the gallery build
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Collect the list first, so a failing git diff fails the step
          # instead of skipping the work.
          changed="$(git diff --name-only --no-renames "$BASE...$HEAD")"
          if printf '%s\n' "$changed" | grep -qE '^(src/|gallery/|site/|ARCHITECTURE\.md$|docs/|scripts/build-lib\.sh$|vite\.lib\.config\.ts$|tsconfig[^/]*\.json$|package(-lock)?\.json$|\.github/workflows/gallery\.yml$|\.nvmrc$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No file the gallery build reads changed; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.scope.outputs.run == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
        if: ${{ steps.scope.outputs.run == 'true' }}
      - name: Install the site's packages
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: npm run gallery:install
      - name: Build the package into lib/
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: npm run build
      - name: Typecheck the gallery against lib/
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: npx tsc -p gallery/tsconfig.json --noEmit
      - name: Check the site's pages
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: npm run --prefix site typecheck
      # A pull request's build is served from its preview folder, so its links
      # carry that folder; the live site is served from the root.
      - name: Build the gallery
        if: ${{ steps.scope.outputs.run == 'true' }}
        env:
          GALLERY_BASE: ${{ github.event_name == 'pull_request' && format('/pr-preview/pr-{0}/', github.event.pull_request.number) || '/' }}
        run: npm run gallery:build
      - name: Keep the built page
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-site
          path: site/dist
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/gallery-pages-publish.yml
    with:
      slot: site
      artifact: gallery-site
      run-id: ${{ github.run_id }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
      pages: write
      id-token: write
