name: Sprite atlas

# Builds the sprite atlas archive (scripts/export-atlas.ts, issue #909) for a
# components release tag and attaches it, with a SHA-256 checksum, to that
# tag's GitHub release, so any frontend can fetch the art for the exact
# version it pins. Nothing generated is committed. The bake runs inside the
# pinned Playwright image (the same Chromium the screenshot workflows use), so
# the pixels and the checksum are reproducible.
#
# Run it from the Actions tab with "Use workflow from" set to the release tag
# (v<version>). Every job checks out that dispatched tag itself and
# never another ref, so the code it runs is the code the run was started on,
# and no cache this run could write is shared with main. When the tag's
# release already carries both files, a run is an audit: it checks the
# attached zip against its checksum, re-bakes, and fails on any difference.
#
# Parked: the package has no `atlas` script yet, and scripts/atlas-catalog.ts
# still looks for the engine where the game's build puts it rather than in
# node_modules/@verticopolis/engine. A run fails at the bake until both land.
on:
  workflow_dispatch:

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

permissions:
  contents: read

concurrency:
  group: sprite-atlas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Check the run was dispatched from a components release tag, and pick the
  # Playwright image from that tag's lockfile. A branch or a wrong tag fails
  # here, before any container pull or install.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - name: Check the run is on a release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then echo "::error::Run this from a release tag (v<version>), not a branch."; exit 1; fi
          # Build metadata (+) or a pre-release suffix would change the
          # archive's name; only plain x.y.z releases get an atlas.
          # Versions up to 0.2.1 were tagged components-v<x.y.z>.
          if ! printf '%s' "$TAG" | grep -Eq '^(components-)?v[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::Tag $TAG is not a plain v<x.y.z> release tag."; exit 1; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pin
        run: |
          ver=$(node -e "const l=require('./package-lock.json');const p=l.packages&&l.packages['node_modules/playwright'];process.stdout.write((p&&p.version)||require('./package.json').devDependencies.playwright.replace(/[^0-9.]/g,''))")
          echo "image=mcr.microsoft.com/playwright:v${ver}-jammy" >> "$GITHUB_OUTPUT"

  # The bake draws with the engine's own catalog, from the @verticopolis/engine
  # package npm ci installs (scripts/atlas-catalog.ts), so nothing is compiled.
  build:
    needs: resolve
    runs-on: ubuntu-latest
    # A full bake takes about eight minutes; anything near this is a hang.
    timeout-minutes: 45
    container:
      image: ${{ needs.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image ships an older Node; install the repo's pinned one over it.
      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      # git refuses a workspace owned by another user inside the container;
      # the export reads the commit it records from git.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci

      # The export launches Playwright's own Chromium from the image, checks
      # the atlas against the game's paint for the sample signatures, bakes,
      # checks the packed pages, and writes the archive named after the tag.
      - name: Bake the atlas in the pinned Chromium
        env:
          TAG: ${{ github.ref_name }}
        run: npm run atlas -- --out dist-atlas --label "$TAG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprite-atlas
          path: dist-atlas/
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sprite-atlas
          path: dist-atlas

      - name: Check the checksum after the transfer
        working-directory: dist-atlas
        run: sha256sum --check ./*.sha256

      - name: Attach to the release, or audit what is attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          zip="dist-atlas/verticopolis-atlas-${TAG}.zip"
          sum="${zip}.sha256"
          test -f "$zip" && test -f "$sum"
          # The tag's published release. An API error fails the step rather
          # than reading as "no release".
          list="$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.tag_name == env.TAG and .draft == false) | .id')"
          count="$(printf '%s\n' "$list" | grep -c . || true)"
          if [ "$count" -eq 0 ]; then
            echo "::error::Tag $TAG has no published release. Run the Release components workflow for it first."
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "::error::Tag $TAG has more than one published release."
            exit 1
          fi
          id="$list"
          # The release's assets, as "id name" lines.
          assets="$(gh api "repos/$GH_REPO/releases/$id/assets" --paginate --jq '.[] | "\(.id) \(.name)"')"
          zip_id="$(printf '%s\n' "$assets" | awk -v n="$(basename "$zip")" '$2 == n { print $1 }')"
          sum_id="$(printf '%s\n' "$assets" | awk -v n="$(basename "$sum")" '$2 == n { print $1 }')"

          if [ -n "$zip_id" ] && [ -n "$sum_id" ]; then
            # Both files are attached: never replace them. A rebuild is an
            # audit: the attached zip must match the attached checksum, and
            # the fresh bake must reproduce that checksum exactly.
            mkdir -p attached
            gh api "repos/$GH_REPO/releases/assets/$zip_id" -H "Accept: application/octet-stream" > "attached/$(basename "$zip")"
            gh api "repos/$GH_REPO/releases/assets/$sum_id" -H "Accept: application/octet-stream" > "attached/$(basename "$sum")"
            if ! (cd attached && sha256sum --check "$(basename "$sum")"); then
              echo "::error::The zip attached to release $TAG does not match the checksum attached beside it."
              exit 1
            fi
            if cmp -s "attached/$(basename "$sum")" "$sum"; then
              echo "Release $TAG already carries this atlas: $(cut -d' ' -f1 "$sum")"
              exit 0
            fi
            echo "::error::Rebuilding $TAG gave a different atlas than the one attached (a tag moved after publishing is one likely cause). Attached: $(cut -d' ' -f1 "attached/$(basename "$sum")"), rebuilt: $(cut -d' ' -f1 "$sum")."
            exit 1
          fi

          # Nothing, or only half of a pair from an interrupted attempt, is
          # attached. Drop the half and upload the zip, then the checksum, so a
          # checksum on the page always has its zip beside it.
          for old in $zip_id $sum_id; do
            gh api -X DELETE "repos/$GH_REPO/releases/assets/$old"
          done
          for f in "$zip" "$sum"; do
            gh api -X POST "https://uploads.github.com/repos/$GH_REPO/releases/$id/assets?name=$(basename "$f")" \
              -H "Content-Type: application/octet-stream" --input "$f" > /dev/null
          done
          echo "Attached $(basename "$zip") ($(cut -d' ' -f1 "$sum")) to release $TAG."
