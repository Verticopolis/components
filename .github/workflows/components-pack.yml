name: Components package

# Packs @verticopolis/components (scripts/pack-components.sh), the tarball a
# game pins.
#
# - A pull request or a push to main uploads the tarball as a run artifact.
#   A PR's tarball is versioned 0.0.0-pr.<number>.<run> and main's
#   0.0.0-main.<run>, so a game PR can try one without mistaking it for a
#   release.
#
# Releases come from components-release.yml alone, which packs, tags and
# publishes the GitHub release and npm in one run.
#
# A pull request that changes only prose (.github/actions/docs-only lists
# it) still runs the job, so the required check reports, but every step
# after Scope skips and no tarball is uploaded. A new step here needs the
# same `if`.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pack:
    name: Pack the components
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its base, for the scope step below.
          fetch-depth: 2
          persist-credentials: false

      - name: Scope
        id: scope
        uses: ./.github/actions/docs-only

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Version
        if: steps.scope.outputs.run == 'true'
        id: version
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_number }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then version="0.0.0-pr.$PR.$RUN"; else version="0.0.0-main.$RUN"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        if: steps.scope.outputs.run == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh scripts/pack-components.sh "$VERSION" dist

      # Install the tarball into an empty project with its peers and
      # type-check every exported declaration under bundler and nodenext
      # resolution, with skipLibCheck off.
      - name: Use the packed tarball as a game would
        if: steps.scope.outputs.run == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh scripts/package-consumer.sh "dist/verticopolis-components-$VERSION.tgz"

      # Every module the exports map serves loads under Node with only the
      # peers installed, and its declarations type-check there.
      - name: Load every module with only the peers installed
        if: steps.scope.outputs.run == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh scripts/node-consumer.sh "dist/verticopolis-components-$VERSION.tgz"

      - name: Upload the tarball
        if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: components-package-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
