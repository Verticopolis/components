name: Test CI

concurrency:
  # Cancel superseded PR runs; keep main pushes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# The package's checks until the split's cut: install from the lockfile, then
# typecheck and lint the sources that ship. The unit tests join this job in the
# PR that adds the package build, which also replaces the fixtures that still
# reach the game's test helpers. The game's e2e, engine-host and WASM jobs stay
# in the game's repository.
jobs:
  test:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
