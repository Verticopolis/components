name: Test CI

concurrency:
  # Cancel superseded PR runs; keep main pushes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# The package's checks: install from the lockfile, then typecheck, lint and
# run the unit tests. The tests mock the engine and read its catalog from the
# JSON fixtures in src/simport/fixtures, so no engine build is needed. The
# game's e2e, engine-host and WASM jobs stay in the game's repository.
jobs:
  test:
    # The name stays "Typecheck and lint": the rulesets require that check.
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
